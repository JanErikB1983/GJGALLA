<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Service Dashboard | Galla</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent: #d4af37; /* Gull */
            --alert: #ff5252; /* Rød for viktig info */
            --warning: #ffb74d; /* Oransje */
            --border-radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        /* --- CONTROL BAR (STICKY) --- */
        .control-bar {
            position: sticky;
            top: 0;
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px;
            z-index: 100;
            border-bottom: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { font-size: 1.2rem; font-weight: 700; color: var(--accent); margin: 0; }
        .stats { font-size: 0.8rem; color: var(--text-muted); }

        /* TOGGLE SWITCH */
        .toggle-container {
            display: flex;
            align-items: center;
            background: #2c2c2c;
            padding: 4px;
            border-radius: 50px;
            position: relative;
            cursor: pointer;
            width: 100%;
            height: 44px;
        }

        .toggle-btn {
            flex: 1;
            text-align: center;
            padding: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 2;
            transition: color 0.3s;
        }

        .toggle-bg {
            position: absolute;
            left: 4px;
            top: 4px;
            bottom: 4px;
            width: calc(50% - 4px);
            background: var(--accent);
            border-radius: 50px;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
        }

        /* State classes for toggle */
        body[data-mode="all"] .toggle-bg { transform: translateX(0); }
        body[data-mode="allergy"] .toggle-bg { transform: translateX(100%); background-color: var(--alert); }
        
        body[data-mode="all"] .btn-all { color: #000; }
        body[data-mode="allergy"] .btn-allergy { color: #fff; }

        /* --- SEARCH --- */
        .search-wrapper {
            margin: 10px 15px;
        }
        .search-input {
            width: 100%;
            background: #2c2c2c;
            border: 1px solid #444;
            padding: 12px 15px;
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }
        .search-input:focus { outline: none; border-color: var(--accent); }

        /* --- GRID --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            padding: 15px;
        }

        /* --- CARD --- */
        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            border: 1px solid #333;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .card-header {
            padding: 12px 15px;
            background: #252525;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .table-title { font-weight: 700; font-size: 1.1rem; }
        .table-meta { font-size: 0.8rem; color: var(--text-muted); }
        
        .alert-badge {
            background: rgba(255, 82, 82, 0.15);
            color: var(--alert);
            border: 1px solid var(--alert);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            display: none; /* Shows via JS */
        }

        /* --- LIST ITEMS --- */
        .seat-list {
            display: flex;
            flex-direction: column;
        }

        .seat-item {
            display: flex;
            align-items: flex-start; /* Align top for multi-line allergies */
            padding: 12px 15px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 0.95rem;
        }
        .seat-item:last-child { border-bottom: none; }

        .seat-num {
            width: 28px;
            height: 28px;
            background: #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            margin-right: 12px;
            flex-shrink: 0;
            color: #aaa;
        }

        .seat-content { flex: 1; }
        
        .seat-name { display: block; font-weight: 500; }
        
        .allergy-tag {
            display: inline-block;
            margin-top: 4px;
            font-size: 0.85rem;
            color: var(--alert);
            font-weight: 600;
            background: rgba(255, 82, 82, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* --- MODES --- */
        /* Hiding mechanics for "Show Only Allergies" mode */
        body[data-mode="allergy"] .seat-item:not(.has-allergy) {
            display: none;
        }
        
        body[data-mode="allergy"] .card:not(.has-allergy-content) {
            opacity: 0.3; /* Dim tables with no allergies */
            pointer-events: none;
        }

        /* Highlight styles */
        .highlight {
            background-color: rgba(212, 175, 55, 0.2);
            border-left: 3px solid var(--accent);
        }

    </style>
</head>
<body data-mode="all">

    <div class="control-bar">
        <div class="header-row">
            <div>
                <h1>Kjøkkenoversikt</h1>
                <div class="stats" id="totalStats">Laster data...</div>
            </div>
            <img src="https://www.gronnjobb.no/hubfs/Imported%20images/logo-02.svg" style="height:24px; filter:invert(1); opacity:0.7;">
        </div>

        <div class="toggle-container" onclick="toggleMode()">
            <div class="toggle-bg"></div>
            <div class="toggle-btn btn-all">Alle Gjester</div>
            <div class="toggle-btn btn-allergy">Kun Allergier</div>
        </div>
        
        <input type="text" class="search-input" id="searchInput" placeholder="Søk navn eller allergi...">
    </div>

    <div class="grid" id="app"></div>

    <script>
        // --- DATA ---
        const allergyMap = {
            "albina": "Svin",
            "ann kristin": "Sopp",
            "christer j": "Skalldyr",
            "joachim": "Løk, nøtter, frø, melk, meieri, egg, korn, gluten",
            "josefine": "Svin",
            "lotte": "Skalldyr og fisk",
            "malin": "Lam og fårekjøtt",
            "mentor": "Skalldyr og svin",
            "preben": "Gluten, skalldyr, hvit fisk, nøtter",
            "silje s": "Kiwi, paprika",
            "terje k": "Fersk pepperrot",
            "therese g": "Gluten/cøliaki, hvete, rug, bygg, havre",
            "tonje": "Laktose- og glutenintoleranse",
            "tore bjørn": "Gluten"
        };

        const tablesData = [
            ["Mattis", "Mathias", "Martin", "Patrick J", "Rene", "Christine", "Linn", "Malin", "Jeanett"],
            ["Nina", "Linda A", "Linda H", "Cecilie", "Andrine", "Therese H", "Rita", "Peter", "Tore Bjørn"],
            ["Hanne", "Gøril", "Frederic", "Håvar", "Christian", "Tommy", "Marthe", "Andrea", "Anette"],
            ["Mona", "Preben", "Albina", "Julie", "Dan Mario", "Pezhman", "Joachim", "Hemmelig", "Petter"],
            ["Katrine NH", "Camilla L", "Sonja", "Dina", "Gine", "Eli Sofie", "Oddbjørn", "Christer M", "Willy"],
            ["Mathias", "Simon", "Silje S", "Miriam", "Idris", "Tobias", "Mats", "Marius", "Terje K"],
            ["Patrick H", "Madelen", "Camilla A", "Rasmus", "Steffen", "Stig Owe", "Ingrid Lene", "Therese G", "Josefine"],
            ["Lotte", "Tina", "Marielle", "Line", "Silje O", "Ørjan", "Adam", "Per", "Tonje"],
            ["Therese D", "Marte", "Katrine H", "Ann Kristin", "Aslaug", "Terje L", "Lars", "Christer J","Dalida", "Mentor"]
        ];

        // Process Data
        let totalAllergies = 0;
        const tables = tablesData.map((names, i) => {
            const guests = names.map(name => {
                const allergy = allergyMap[name.toLowerCase()] || null;
                if(allergy) totalAllergies++;
                return { name, allergy };
            });
            // Fill to 10 seats for seat numbering consistency if needed, 
            // but for list view we only show actual guests or explicit empties.
            // Let's just keep actual guests for cleaner list.
            return { id: i + 1, guests };
        });

        // --- RENDER ---
        const app = document.getElementById('app');
        const statsEl = document.getElementById('totalStats');

        function render() {
            statsEl.innerText = `${tablesData.flat().length} gjester • ${totalAllergies} med avvik`;
            
            app.innerHTML = '';
            
            tables.forEach(table => {
                const allergyCount = table.guests.filter(g => g.allergy).length;
                
                const card = document.createElement('div');
                card.className = 'card';
                if(allergyCount > 0) card.classList.add('has-allergy-content');
                card.dataset.tableId = table.id;

                const alertBadge = allergyCount > 0 
                    ? `<span class="alert-badge" style="display:inline-block">⚠️ ${allergyCount}</span>` 
                    : '';

                let html = `
                    <div class="card-header">
                        <div class="table-title">Bord ${table.id}</div>
                        <div class="table-meta">${alertBadge}</div>
                    </div>
                    <div class="seat-list">
                `;

                table.guests.forEach((guest, index) => {
                    const seatNum = index + 1;
                    const isAllergic = !!guest.allergy;
                    const allergyClass = isAllergic ? 'has-allergy' : '';
                    
                    // Highlight logic for styling
                    const numStyle = isAllergic ? 'background:var(--alert); color:white; border:none;' : '';

                    html += `
                        <div class="seat-item ${allergyClass}" data-search="${guest.name.toLowerCase()} ${guest.allergy ? guest.allergy.toLowerCase() : ''}">
                            <div class="seat-num" style="${numStyle}">${seatNum}</div>
                            <div class="seat-content">
                                <span class="seat-name">${guest.name}</span>
                                ${guest.allergy ? `<div class="allergy-tag">⚠️ ${guest.allergy}</div>` : ''}
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
                card.innerHTML = html;
                app.appendChild(card);
            });
        }

        // --- LOGIC ---
        
        // Mode Toggle
        let currentMode = 'all';
        function toggleMode() {
            currentMode = currentMode === 'all' ? 'allergy' : 'all';
            document.body.setAttribute('data-mode', currentMode);
        }

        // Search
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            
            // If searching, enforce "all" mode temporarily or just filter visible items
            // Let's stick to highlighting matches
            
            document.querySelectorAll('.seat-item').forEach(item => {
                const text = item.dataset.search;
                if(term === "") {
                    item.classList.remove('highlight');
                    item.style.display = ""; // Reset inline styles
                } else {
                    if(text.includes(term)) {
                        item.classList.add('highlight');
                        // Ensure it's visible even in allergy mode if it matches search? 
                        // UX choice: Keep mode logic strict, search highlights what's visible.
                    } else {
                        item.classList.remove('highlight');
                    }
                }
            });

            // Scroll to first match
            if(term.length > 2) {
                const match = document.querySelector('.highlight');
                if(match) {
                    match.scrollIntoView({behavior: "smooth", block: "center"});
                }
            }
        });

        // Init
        render();

    </script>
</body>
</html>
