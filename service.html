<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Service View | Grønn Jobb Galla</title>
    <style>
        /* --- BRANDING & VARIABLER --- */
        :root {
            --primary: #0a3024;        
            --secondary: #027b5f;      
            --bg-light: #e8f6f4;       
            --white: #ffffff;
            --text-dark: #1a1a1a;
            --accent: #d4af37;
            /* NYE FARGER FOR SERVICE/ALLERGI */
            --alert-bg: #fff5f5;
            --alert-text: #c53030;
            --alert-border: #fc8181;
            
            --radius: 16px;
            --shadow: 0 10px 30px -10px rgba(10, 48, 36, 0.15);
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-light);
            color: var(--text-dark);
            padding-bottom: 80px;
            -webkit-font-smoothing: antialiased;
        }

        /* --- HEADER --- */
        header {
            background-color: var(--primary);
            color: var(--white);
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            margin-bottom: -20px;
            position: sticky; 
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            max-width: 1200px;
            margin: 0 auto 15px;
        }

        .logo {
            height: 35px;
            filter: brightness(0) invert(1); 
            opacity: 0.9;
        }

        .role-badge {
            background: var(--accent);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- SØK --- */
        .search-container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 14px 20px;
            border-radius: 50px;
            border: none;
            font-size: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            outline: none;
        }

        /* --- GRID CONTAINER --- */
        .container {
            max-width: 1200px;
            margin: 40px auto 0;
            padding: 0 15px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        @media (min-width: 768px) { .container { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1100px) { .container { grid-template-columns: repeat(3, 1fr); } }

        /* --- BORDKORT --- */
        .card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.5);
            scroll-margin-top: 140px; 
            transition: opacity 0.3s;
        }

        .card-header {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
            background-color: #fafdfc;
        }

        .card-title {
            color: var(--primary);
            font-size: 1.2rem;
            font-weight: 800;
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--secondary);
            margin-top: 4px;
            font-weight: 500;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .meta-allergies {
            color: var(--alert-text);
            font-weight: 700;
            background: var(--alert-bg);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            border: 1px solid rgba(197, 48, 48, 0.2);
        }

        /* --- VISUELL SIRKEL --- */
        .visual-area {
            position: relative;
            width: 100%;
            padding: 25px 0;
            display: flex;
            justify-content: center;
            background: radial-gradient(circle at center, #fff 0%, #f7fffd 70%);
        }

        .table-circle {
            width: 160px;
            height: 160px;
            position: relative;
            border-radius: 50%;
            background-color: var(--primary);
            box-shadow: 0 8px 25px rgba(10, 48, 36, 0.25);
            border: 5px solid #eefef9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 1.8rem;
            font-weight: 700;
            z-index: 1;
        }

        /* Setet i sirkelen */
        .seat-dot {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: var(--white);
            border: 2px solid var(--secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: transform 0.2s;
            z-index: 10;
        }

        /* ALLERGI INDIKATOR I SIRKELEN */
        .seat-dot.has-allergy {
            background-color: var(--alert-text);
            color: white;
            border-color: var(--alert-text);
            box-shadow: 0 0 0 3px var(--alert-bg);
        }

        /* --- GJESTELISTE --- */
        .guest-list {
            padding: 15px;
            background-color: var(--white);
        }

        .guest-item {
            display: flex;
            flex-direction: column; /* Endret for å få plass til allergitekst */
            padding: 10px;
            border-radius: 8px;
            border-bottom: 1px solid #f7f7f7;
            cursor: pointer;
        }
        
        .guest-item:last-child { border-bottom: none; }
        .guest-item:active { background-color: #f0f9f6; }

        .guest-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .guest-info-left {
            display: flex;
            align-items: center;
        }

        .guest-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background-color: var(--bg-light);
            color: var(--secondary);
            border-radius: 50%;
            font-size: 11px;
            font-weight: 700;
            margin-right: 10px;
            flex-shrink: 0;
            border: 1px solid rgba(2, 123, 95, 0.2);
        }

        .guest-name {
            color: var(--text-dark);
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* ALLERGI STYLES I LISTEN */
        .allergy-icon {
            color: var(--alert-text);
            font-size: 1.2rem;
            display: none; /* Skjult som standard */
        }

        .allergy-details {
            font-size: 0.85rem;
            color: var(--alert-text);
            margin-top: 4px;
            margin-left: 34px; /* Indent for å matche navnet */
            font-weight: 500;
            line-height: 1.3;
            background: var(--alert-bg);
            padding: 6px 10px;
            border-radius: 6px;
            display: none;
        }

        /* Når gjesten har allergi */
        .guest-item.is-allergic .allergy-icon { display: block; }
        .guest-item.is-allergic .allergy-details { display: block; }
        .guest-item.is-allergic .guest-number { 
            background-color: var(--alert-text); 
            color: white; 
            border-color: var(--alert-text);
        }

        /* --- STATES --- */
        .card.dimmed { opacity: 0.4; }
        
        .seat-dot.highlight, .guest-item.highlight {
            background-color: var(--primary);
            color: white;
        }
        .seat-dot.highlight { border-color: var(--accent); transform: scale(1.2); }
        .guest-item.highlight .guest-name { color: white; }
        .guest-item.highlight .allergy-details { 
            background-color: white; 
            color: var(--alert-text); 
        }

        .seat-dot.empty, .guest-item.empty-seat { display: none; }

    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <img src="https://www.gronnjobb.no/hubfs/Imported%20images/logo-02.svg" alt="Grønn Jobb" class="logo">
            <span class="role-badge">Service View</span>
        </div>
        
        <div class="search-container">
            <input type="text" class="search-box" id="searchInput" placeholder="Søk navn eller allergi...">
        </div>
    </header>

    <div class="container" id="app"></div>

    <script>
        // --- DATA ---
        // Allergidata (Mappet mot navn i små bokstaver for matching)
        const allergyMap = {
            "albina": "Svin",
            "ann kristin": "Sopp",
            "christer j": "Skalldyr",
            "joachim": "Løk, nøtter, frø, melk, meieri, egg, korn, gluten",
            "josefine": "Svin",
            "lotte": "Skalldyr og fisk",
            "malin": "Lam og fårekjøtt",
            "mentor": "Skalldyr og svin",
            "preben": "Gluten, skalldyr, hvit fisk, nøtter",
            "silje s": "Kiwi, paprika",
            "terje k": "Fersk pepperrot",
            "therese g": "Gluten/cøliaki, hvete, rug, bygg, havre",
            "tonje": "Laktose- og glutenintoleranse",
            "tore bjørn": "Gluten"
        };

        const tablesData = [
            ["Mattis", "Mathias", "Martin", "Patrick J", "Rene", "Christine", "Linn", "Malin", "Jeanett"],
            ["Nina", "Linda A", "Linda H", "Cecilie", "Andrine", "Therese H", "Rita", "Peter", "Tore Bjørn"],
            ["Hanne", "Gøril", "Frederic", "Håvar", "Christian", "Tommy", "Marthe", "Andrea", "Anette"],
            ["Mona", "Preben", "Albina", "Julie", "Dan Mario", "Pezhman", "Joachim", "Hemmelig", "Petter"],
            ["Katrine NH", "Camilla L", "Sonja", "Dina", "Gine", "Eli Sofie", "Oddbjørn", "Christer M", "Willy"],
            ["Mathias", "Simon", "Silje S", "Miriam", "Idris", "Tobias", "Mats", "Marius", "Terje K"],
            ["Patrick H", "Madelen", "Camilla A", "Rasmus", "Steffen", "Stig Owe", "Ingrid Lene", "Therese G", "Josefine"],
            ["Lotte", "Tina", "Marielle", "Line", "Silje O", "Ørjan", "Adam", "Per", "Tonje"],
            ["Therese D", "Marte", "Katrine H", "Ann Kristin", "Aslaug", "Terje L", "Lars", "Christer J","Dalida", "Mentor"]
        ];

        // Bygg data-struktur
        const tables = [];
        tablesData.forEach((guestNames, index) => {
            const tableId = index + 1;
            const capacity = 10; 
            let guests = [];
            
            guestNames.forEach(name => {
                // Sjekk allergi (case insensitive)
                const lowerName = name.toLowerCase();
                const allergyInfo = allergyMap[lowerName] || null;
                guests.push({ name: name, allergy: allergyInfo });
            });

            // Fyll på med tomme plasser
            while(guests.length < capacity) { guests.push(null); }
            
            tables.push({ id: tableId, name: "Bord " + tableId, guests: guests, capacity: capacity });
        });

        // --- RENDER ---
        const app = document.getElementById('app');

        function render() {
            app.innerHTML = '';
            tables.forEach(table => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${table.id}`;

                // Tell allergier på bordet
                const allergyCount = table.guests.filter(g => g && g.allergy).length;
                const filledSeats = table.guests.filter(g => g !== null).length;
                
                // Header med allergivarsel
                const allergyBadge = allergyCount > 0 
                    ? `<span class="meta-allergies">⚠️ ${allergyCount} allergier</span>` 
                    : '';

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title">${table.name}</div>
                        <div class="card-meta">
                            <span>${filledSeats} gjester</span>
                            ${allergyBadge}
                        </div>
                    </div>
                `;

                // Visuell sirkel
                const visualArea = document.createElement('div');
                visualArea.className = 'visual-area';
                const tableCircle = document.createElement('div');
                tableCircle.className = 'table-circle';
                tableCircle.innerText = table.id;

                table.guests.forEach((guest, index) => {
                    const seatNum = index + 1;
                    const angle = (index * (360 / table.capacity)) - 90;
                    const angleRad = angle * (Math.PI / 180);
                    const distance = 100; // Litt kortere avstand for kompakt view

                    const dot = document.createElement('div');
                    dot.className = 'seat-dot';
                    
                    if(!guest) {
                        dot.classList.add('empty'); 
                    } else if (guest.allergy) {
                        dot.classList.add('has-allergy'); // Rød markering
                        dot.innerText = "!"; // Utropstegn i setet
                    } else {
                        dot.innerText = seatNum;
                    }
                    
                    dot.dataset.seatIndex = index; 
                    
                    const x = Math.cos(angleRad) * distance;
                    const y = Math.sin(angleRad) * distance;
                    dot.style.transform = `translate(${x}px, ${y}px)`;
                    tableCircle.appendChild(dot);
                });
                visualArea.appendChild(tableCircle);
                card.appendChild(visualArea);

                // Liste
                const listArea = document.createElement('div');
                listArea.className = 'guest-list';
                
                table.guests.forEach((guest, index) => {
                    const item = document.createElement('div');
                    item.className = 'guest-item';
                    item.dataset.seatIndex = index;
                    
                    if (guest) {
                        item.dataset.name = guest.name.toLowerCase();
                        if(guest.allergy) {
                            item.classList.add('is-allergic');
                            item.dataset.allergy = guest.allergy.toLowerCase();
                        }

                        item.innerHTML = `
                            <div class="guest-main-row">
                                <div class="guest-info-left">
                                    <div class="guest-number">${index + 1}</div>
                                    <div class="guest-name">${guest.name}</div>
                                </div>
                                <div class="allergy-icon">⚠️</div>
                            </div>
                            <div class="allergy-details">
                                <strong>Allergi:</strong> ${guest.allergy || ''}
                            </div>
                        `;
                    } else {
                        item.classList.add('empty-seat');
                    }
                    
                    // Interaction
                    item.addEventListener('click', () => {
                        if(!guest) return;
                        
                        // Toggle highlight
                        const isHighlighted = item.classList.contains('highlight');
                        
                        // Reset all highlights inside this card first (optional, prevents clutter)
                        card.querySelectorAll('.highlight').forEach(el => el.classList.remove('highlight'));

                        if(!isHighlighted) {
                            item.classList.add('highlight');
                            const dot = tableCircle.querySelector(`.seat-dot[data-seat-index="${index}"]`);
                            if(dot) dot.classList.add('highlight');
                        }
                    });

                    listArea.appendChild(item);
                });
                card.appendChild(listArea);
                app.appendChild(card);
            });
        }

        // --- SØK & SCROLL ---
        const searchInput = document.getElementById('searchInput');
        let scrollTimeout; 

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const cards = document.querySelectorAll('.card');
            const allItems = document.querySelectorAll('.guest-item');
            
            // Reset
            allItems.forEach(el => el.classList.remove('highlight'));
            document.querySelectorAll('.seat-dot').forEach(el => el.classList.remove('highlight'));
            cards.forEach(c => {
                c.classList.remove('dimmed');
                delete c.dataset.hasMatch;
            });
            clearTimeout(scrollTimeout);

            if (term.length === 0) return;

            let firstMatchElement = null;
            let globalMatchFound = false;

            allItems.forEach(item => {
                const name = item.dataset.name;
                const allergy = item.dataset.allergy || ""; // Søk også i allergi
                
                if ((name && name.includes(term)) || (allergy && allergy.includes(term))) {
                    globalMatchFound = true;
                    item.classList.add('highlight');
                    
                    const card = item.closest('.card');
                    const index = item.dataset.seatIndex;
                    const dot = card.querySelector(`.seat-dot[data-seat-index="${index}"]`);
                    if(dot) dot.classList.add('highlight');
                    card.dataset.hasMatch = "true";

                    if (!firstMatchElement) firstMatchElement = item;
                }
            });

            if (globalMatchFound) {
                cards.forEach(card => {
                    if (card.dataset.hasMatch !== "true") card.classList.add('dimmed');
                });

                scrollTimeout = setTimeout(() => {
                    if (firstMatchElement) {
                        firstMatchElement.closest('.card').scrollIntoView({ 
                            behavior: 'smooth', block: 'start' 
                        });
                    }
                }, 500); 
            }
        });

        render();
    </script>
</body>
</html>
